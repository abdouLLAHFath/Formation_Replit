<svg width="400" height="260" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration d'une salle de réception décorée, table ronde et chaises">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EFDF"/>
      <stop offset="1" stop-color="#EFE1C4"/>
    </linearGradient>
    <radialGradient id="clothGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#E7DAB8"/>
    </radialGradient>
    <symbol id="chair" viewBox="0 0 40 54">
      <line x1="10" y1="40" x2="8" y2="53" stroke="#9C7A42" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="30" y1="40" x2="32" y2="53" stroke="#9C7A42" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="12" y1="37" x2="12" y2="49" stroke="#9C7A42" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="28" y1="37" x2="28" y2="49" stroke="#9C7A42" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="5" y="29" width="30" height="11" rx="4" fill="#EDE2C8" stroke="#B8791A" stroke-width="1.6"/>
      <rect x="9" y="1" width="22" height="31" rx="9" fill="#F5EEDC" stroke="#B8791A" stroke-width="1.6"/>
      <path d="M20,6 L20,27" stroke="#B8791A" stroke-width="1.2" opacity=".6"/>
    </symbol>
  </defs>

  <rect width="400" height="260" fill="url(#wallGrad)"/>
  <rect x="0" y="196" width="400" height="64" fill="#E3D5B2"/>
  <rect x="0" y="196" width="400" height="5" fill="#D2C093"/>

  <!-- tentures latérales -->
  <path d="M0,0 L54,0 Q42,70 54,150 Q40,185 0,196 Z" fill="#E2B7A1"/>
  <path d="M0,0 L54,0 Q42,70 54,150 Q40,185 0,196 Z" fill="none" stroke="#C98E72" stroke-width="2" opacity=".5"/>
  <path d="M400,0 L346,0 Q358,70 346,150 Q360,185 400,196 Z" fill="#E2B7A1"/>
  <path d="M400,0 L346,0 Q358,70 346,150 Q360,185 400,196 Z" fill="none" stroke="#C98E72" stroke-width="2" opacity=".5"/>
  <g stroke="#C98E72" stroke-width="1.4" opacity=".55" fill="none">
    <path d="M14,0 Q6,80 16,196"/>
    <path d="M30,0 Q24,80 32,196"/>
    <path d="M386,0 Q394,80 384,196"/>
    <path d="M370,0 Q376,80 368,196"/>
  </g>

  <!-- guirlande lumineuse -->
  <path d="M55,26 Q200,74 345,26" fill="none" stroke="#C9A24A" stroke-width="1.6"/>
  <g fill="#F2C65C" stroke="#B8791A" stroke-width=".6">
    <circle cx="80" cy="35" r="3.4"/>
    <circle cx="120" cy="48" r="3.4"/>
    <circle cx="160" cy="57" r="3.4"/>
    <circle cx="200" cy="60" r="3.4"/>
    <circle cx="240" cy="57" r="3.4"/>
    <circle cx="280" cy="48" r="3.4"/>
    <circle cx="320" cy="35" r="3.4"/>
  </g>

  <!-- ombre portée -->
  <ellipse cx="200" cy="222" rx="118" ry="13" fill="#000" opacity=".08"/>

  <!-- chaises du fond -->
  <g transform="translate(142,120) scale(.68)"><use href="#chair" x="-20" y="-27" width="40" height="54"/></g>
  <g transform="translate(258,120) scale(.68)"><use href="#chair" x="-20" y="-27" width="40" height="54"/></g>

  <!-- table -->
  <ellipse cx="200" cy="190" rx="118" ry="30" fill="#D8CBAA"/>
  <ellipse cx="200" cy="182" rx="118" ry="30" fill="url(#clothGrad)" stroke="#C9B896" stroke-width="2"/>

  <!-- chaises de côté -->
  <g transform="translate(66,172) scale(.85) rotate(-6)"><use href="#chair" x="-20" y="-27" width="40" height="54"/></g>
  <g transform="translate(334,172) scale(.85) rotate(6)"><use href="#chair" x="-20" y="-27" width="40" height="54"/></g>

  <!-- centre de table : petit bouquet -->
  <g transform="translate(200,174) scale(.46)">
    <path d="M190,80 C184,55 192,38 200,24" stroke="#5B7A5B" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M210,80 C214,58 206,42 200,30" stroke="#5B7A5B" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M200,80 C196,56 204,44 200,24" stroke="#5B7A5B" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g transform="translate(182,52)">
      <g fill="#B8791A">
        <ellipse cx="0" cy="-13" rx="7" ry="11" transform="rotate(0)"/>
        <ellipse cx="0" cy="-13" rx="7" ry="11" transform="rotate(72)"/>
        <ellipse cx="0" cy="-13" rx="7" ry="11" transform="rotate(144)"/>
        <ellipse cx="0" cy="-13" rx="7" ry="11" transform="rotate(216)"/>
        <ellipse cx="0" cy="-13" rx="7" ry="11" transform="rotate(288)"/>
      </g>
      <circle r="6" fill="#6B4A24"/>
    </g>
    <g transform="translate(218,52)">
      <g fill="#C98A63">
        <ellipse cx="0" cy="-13" rx="7" ry="11" transform="rotate(0)"/>
        <ellipse cx="0" cy="-13" rx="7" ry="11" transform="rotate(72)"/>
        <ellipse cx="0" cy="-13" rx="7" ry="11" transform="rotate(144)"/>
        <ellipse cx="0" cy="-13" rx="7" ry="11" transform="rotate(216)"/>
        <ellipse cx="0" cy="-13" rx="7" ry="11" transform="rotate(288)"/>
      </g>
      <circle r="6" fill="#6B4A24"/>
    </g>
    <g transform="translate(200,24)">
      <g fill="#D97757">
        <ellipse cx="0" cy="-14" rx="7.5" ry="12" transform="rotate(0)"/>
        <ellipse cx="0" cy="-14" rx="7.5" ry="12" transform="rotate(60)"/>
        <ellipse cx="0" cy="-14" rx="7.5" ry="12" transform="rotate(120)"/>
        <ellipse cx="0" cy="-14" rx="7.5" ry="12" transform="rotate(180)"/>
        <ellipse cx="0" cy="-14" rx="7.5" ry="12" transform="rotate(240)"/>
        <ellipse cx="0" cy="-14" rx="7.5" ry="12" transform="rotate(300)"/>
      </g>
      <circle r="7" fill="#6B4A24"/>
    </g>
    <path d="M172,86 L228,86 L220,150 L180,150 Z" fill="#F5EEDC" stroke="#C9B896" stroke-width="2"/>
  </g>

  <!-- chaises de devant -->
  <g transform="translate(128,228) scale(1.05) rotate(-3)"><use href="#chair" x="-20" y="-27" width="40" height="54"/></g>
  <g transform="translate(272,228) scale(1.05) rotate(3)"><use href="#chair" x="-20" y="-27" width="40" height="54"/></g>
</svg>
