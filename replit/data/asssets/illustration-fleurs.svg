      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(0)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(60)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(120)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(180)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(240)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(300)"/>
