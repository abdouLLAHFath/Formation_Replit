      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(0)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(60)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(120)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(180)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(240)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(300)"/>
    </g>
    <circle r="7" fill="#8C6A3F"/>
  </g>

  <g transform="translate(250,130) scale(.72)">
    <g fill="#E8C27A">
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(0)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(60)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(120)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(180)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(240)"/>
      <ellipse cx="0" cy="-15" rx="8" ry="13" transform="rotate(300)"/>
    </g>
    <circle r="7" fill="#8C6A3F"/>
  </g>

  <g transform="translate(200,78)">
    <g fill="#D97757">
      <ellipse cx="0" cy="-17" rx="9" ry="15" transform="rotate(0)"/>
      <ellipse cx="0" cy="-17" rx="9" ry="15" transform="rotate(60)"/>
      <ellipse cx="0" cy="-17" rx="9" ry="15" transform="rotate(120)"/>
      <ellipse cx="0" cy="-17" rx="9" ry="15" transform="rotate(180)"/>
      <ellipse cx="0" cy="-17" rx="9" ry="15" transform="rotate(240)"/>
      <ellipse cx="0" cy="-17" rx="9" ry="15" transform="rotate(300)"/>
    </g>
    <circle r="8" fill="#8C6A3F"/>
  </g>

  <!-- petites fleurs de remplissage -->
  <g fill="#FBF7EF" stroke="#D9C9A8" stroke-width="1">
    <circle cx="190" cy="52" r="3.5"/>
    <circle cx="212" cy="48" r="3"/>
    <circle cx="168" cy="68" r="3"/>
    <circle cx="232" cy="68" r="3"/>
    <circle cx="200" cy="38" r="3"/>
